name: Build and deploy NoteSound
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:music
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MUSIC_API_URL: ${{ vars.VITE_MUSIC_API_URL }}
          VITE_DISCOVERY_API_URL: ${{ vars.VITE_DISCOVERY_API_URL }}
          VITE_LEGACY_YOUTUBE_ENABLED: "false"
          VITE_YOUTUBE_API_KEY: ""
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
